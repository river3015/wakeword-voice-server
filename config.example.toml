# 自宅・非商用向け。config.local.tomlにコピーして使う（Git対象外）。
# パスはこの設定ファイルの場所を基準に解決する。省略した項目は既定値になる。

# AI：公式CLIを本人のログインで使う。providerで切り替える
provider = "codex" # codex / claude
ai_executable = "codex" # codexなら"codex"、claudeなら"~/.local/bin/claude"など。LaunchAgentではフルパスにする
workdir = "."
sandbox = "read-only" # codexはworkspace-writeも可。claudeはread-onlyのみ。承認要求は自動許可しない
ai_timeout = 180
reasoning_effort = "low" # codex: minimal/low/medium/high、claude: low/medium/high/xhigh/max。空なら既定。低いほど速い
# model = "" # 空ならCLIの既定モデル。claudeでは"sonnet"などの別名も使える

# 検出：ONNX Runtimeと openWakeWord・Silero VAD のモデル
onnxruntime_library = ".vendor/onnxruntime/onnxruntime-osx-arm64-1.29.0/lib/libonnxruntime.1.29.0.dylib"
wake_model = ".models/openwakeword/hey_mycroft_v0.1.onnx"
vad_model = ".models/openwakeword/silero_vad.onnx"

# 文字起こし：whisper-serverを常駐させる。未起動ならこのパスから起動する
whisper_server = ".vendor/whisper.cpp/build/bin/whisper-server"
whisper_model = ".models/whisper/ggml-base.bin"
whisper_url = "http://127.0.0.1:8178"
whisper_threads = 4
gpu = true # Metalを使う
stt_timeout = 60

# 読み上げ：VOICEVOX。未起動ならこのパスから起動する
voicevox_url = "http://127.0.0.1:50021"
voicevox_engine = ".vendor/voicevox/engine/macos-arm64/run"
speaker = 0 # VOICEVOX:四国めたん（あまあま）。選択音声の規約を確認する
voicevox_credit = "VOICEVOX:四国めたん"

# 音声デバイス：名前の一部。空ならOSの既定。一覧は bin/wakeword devices
input_device = ""
output_device = ""
receipt_cue = true
prevent_sleep = true # 起動中だけcaffeinateでスリープを防ぐ
# whisper-serverとVOICEVOXは呼びかけを検出したときに起動し、使わなくなってからこの秒数で止める。
# 0なら起動時から常駐させる（速いが、待ち受け中も約0.4GBのメモリを使う）
service_idle_timeout = 300

# 追加のウェイクワード。共通の前処理は1回だけ計算するので、増やしても負荷はほぼ変わらない。
# action = "turn" は wake_model と同じく依頼を聞いて一往復する（今はこれだけ）。
# TOMLの表なので、トップレベルの項目より後ろ（[capture]の前）に置く
# [[wake_words]]
# model = ".models/openwakeword/hey_jarvis_v0.1.onnx"
# action = "turn"

[capture]
wake_threshold = 0.5
speech_threshold = 0.5
silence_seconds = 1.2 # 短くすると速いが、話の途中で切れやすくなる
start_timeout = 5.0
max_seconds = 30.0
min_speech_seconds = 0.24
settle_seconds = 0.32

[conversation]
ttl = 300 # 最後の成功応答から5分で履歴破棄
max_turns = 6
max_characters = 16000

# スキル：決まった言い回しをAIを通さずに処理する。一致しない発話はAIへ渡す
# リスト：リマインダー.appのリストへ追加・読み上げる。リストは事前に作成しておく。初回は自動化の許可を求められる
[skills.lists]
enabled = false
shopping = "買い物"
todo = "ToDo"
memo = "メモ"

# 天気：Open-Meteoから1地点の予報を取得する（非商用は無料、CC BY 4.0）。座標は小数2桁に丸めて送る
[skills.weather]
enabled = false
latitude = 0.0
longitude = 0.0

# 音楽：ミュージック.appのライブラリの曲とプレイリストを操作する。初回は自動化の許可を求められる
[skills.music]
enabled = false
